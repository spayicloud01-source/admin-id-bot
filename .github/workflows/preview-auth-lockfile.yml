name: Update Preview Auth npm Lockfile
on:
  push:
    branches:
      - feature/admin-password-login-preview-20261031
    paths:
      - .github/workflows/preview-auth-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lockfile without running third-party install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile to current Preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize Preview auth dependencies and npm lockfile"
            git push origin HEAD:feature/admin-password-login-preview-20261031
          fi
